[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ell1-qnms"
version = "0.1.0"
description = "Relativistic ell-boson-star backgrounds and QNM research code"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["background*", "radial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: solver-executing convergence and stability tests"]
