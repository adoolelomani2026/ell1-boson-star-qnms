name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: "3.14"
            locked: true
          - os: ubuntu-latest
            python: "3.13"
            locked: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - if: matrix.locked
        run: python -m pip install -r environment/requirements-lock.txt
      - if: ${{ !matrix.locked }}
        run: python -m pip install -r environment/requirements.txt
      - run: python -m pytest -q
